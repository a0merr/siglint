title: Encoded PowerShell Command
id: powershell_encoded_command
level: high
description: PowerShell launched with a base64 -EncodedCommand payload, common in fileless attacks.
logsource: process
detection:
  selection:
    raw|regex: "(?i)powershell(\\.exe)?.*\\s-e(nc|ncodedcommand)?\\s+[A-Za-z0-9+/=]{20,}"
  condition: selection
