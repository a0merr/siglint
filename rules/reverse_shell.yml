title: Reverse Shell via /dev/tcp
id: reverse_shell_devtcp
level: critical
description: A bash reverse shell using /dev/tcp, a common post-exploitation technique.
logsource: process
detection:
  selection:
    raw|regex: "(bash|sh)\\s+-i.*/dev/tcp/|/dev/tcp/\\d{1,3}(\\.\\d{1,3}){3}"
  condition: selection
